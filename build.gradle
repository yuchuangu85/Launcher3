// Root project = Launcher3QuickStep application (Launcher3 android17 sources, Lawnchair-style layout)
// Plugin versions and maven coordinates live in gradle/libs.versions.toml (version catalog).
import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.android.library) apply false
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.kapt)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.kotlin.parcelize)
    alias(libs.plugins.protobuf)
}

ext {
    FRAMEWORK_PREBUILTS_DIR = "$rootDir/prebuilts/framework"

    // Make the AOSP android17 framework jar the FIRST entry of every javac/kotlinc classpath
    // so hidden com.android.internal / com.android.wm.shell / com.android.systemui.shared
    // classes resolve (mirrors Lawnchair's addFrameworkJar).
    addFrameworkJar = { String name ->
        addFrameworkJarFor(project, name)
    }

    // p-explicit variants so subprojects can add the jars to THEMSELVES
    // (a closure invoked as rootProject.x() delegates `dependencies` to the root project).
    addFrameworkJarFor = { p, String name ->
        def frameworkJar = new File(FRAMEWORK_PREBUILTS_DIR, name)
        if (!frameworkJar.exists()) {
            throw new IllegalArgumentException("Framework jar path ${frameworkJar.path} doesn't exist")
        }
        gradle.projectsEvaluated {
            p.tasks.withType(JavaCompile).configureEach {
                classpath = files(frameworkJar, classpath)
            }
            p.tasks.withType(KotlinCompile).configureEach {
                libraries.setFrom files(frameworkJar, libraries)
            }
        }
        p.dependencies.add('compileOnly', p.files(frameworkJar))
    }

    addPlatformJarsFor = { p, excluded = [] ->
        def jars = new File(FRAMEWORK_PREBUILTS_DIR).listFiles()
            .findAll { it.name.endsWith('.jar') && it.name != 'framework-android17.jar' && !(it.name in excluded) }
            .collect { p.files(it) }
        jars.each { fc -> p.dependencies.add('compileOnly', fc) }
    }

    addSystemUIJar = { p ->
        def sysui = new File(FRAMEWORK_PREBUILTS_DIR, 'SystemUI.jar')
        // Ensure sysui_anim_stub classes come FIRST so the newer animation API wins over the
        // stale prebuilt jar. Each compile task must reference the stub output dir of ITS OWN
        // build type (debug/release) — the AGP project dependency on :sysui_anim_stub already
        // wires the matching lib compile task, so no implicit cross-variant dependency arises.
        gradle.projectsEvaluated {
            def sp = p.project(':sysui_anim_stub')
            def bd = sp.layout.buildDirectory
            def variantOf = { t -> t.name.contains('Release') ? 'release' : 'debug' }
            p.tasks.withType(JavaCompile).configureEach { t ->
                def stubDir = bd.dir("intermediates/javac/${variantOf(t)}/classes").get().asFile
                if (stubDir.exists()) classpath = files(stubDir, sysui, classpath)
            }
            p.tasks.withType(KotlinCompile).configureEach { t ->
                def stubDir = bd.dir("tmp/kotlin-classes/${variantOf(t)}").get().asFile
                if (stubDir.exists()) libraries.setFrom files(stubDir, sysui, libraries)
            }
        }
        p.dependencies.add('compileOnly', p.files(sysui))
    }

}

android {
    namespace "com.android.launcher3"
    compileSdk 37
    buildToolsVersion "37.0.0"

    defaultConfig {
        applicationId "com.android.launcher3"
        minSdk 31
        targetSdk 37
        versionCode 1
        versionName "17.0"
        vectorDrawables.useSupportLibrary = true
        multiDexEnabled false
    }

    // AOSP ships several launcher app targets (Android.bp: Launcher3 / Launcher3QuickStep /
    // Launcher3Go / Launcher3QuickStepGo). This project models the quickstep-kernel variants
    // as product flavors; soong's plain-Launcher3 (src_no_quickstep, no quickstep/platform
    // deps) is not part of this Gradle setup.
    flavorDimensions "launcher"
    productFlavors {
        quickstep {
            dimension "launcher"
            // Default/full Launcher3QuickStep equivalent (matches the current source layout).
        }
        go {
            dimension "launcher"
            // Android Go device variant (soong Launcher3Go / Launcher3QuickStepGo):
            // quickstep sources + go/quickstep/src overrides + go/quickstep/res, and a
            // BuildConfig with WIDGETS_ENABLED / NOTIFICATION_DOTS_ENABLED disabled
            // (mirrors soong launcher-go-build-config genrule).
        }
    }

    signingConfigs {
        // debug: AGP auto-generates ~/.android/debug.keystore
        release {
            // Prefer an explicit keystore passed at build time, e.g. a platform key so the
            // APK can sit in /system/priv-app of the target ROM:
            //   java -jar gradle/wrapper/gradle-wrapper.jar assembleRelease \
            //       -Prelease.storeFile=/path/to/platform.keystore \
            //       -Prelease.storePassword=android \
            //       -Prelease.keyAlias=platform \
            //       -Prelease.keyPassword=android
            // When absent, fall back to the debug keystore so assembleRelease still yields an
            // installable artifact (plain user-install, not a system replacement).
            if (project.hasProperty('release.storeFile')
                    && file(project.property('release.storeFile')).exists()) {
                storeFile file(project.property('release.storeFile'))
                storePassword project.property('release.storePassword')
                keyAlias project.property('release.keyAlias')
                keyPassword project.property('release.keyPassword')
            } else {
                println 'WARNING: no -Prelease.* signing properties; signing release with debug key'
                storeFile signingConfigs.debug.storeFile
                storePassword signingConfigs.debug.storePassword
                keyAlias signingConfigs.debug.keyAlias
                keyPassword signingConfigs.debug.keyPassword
            }
        }
    }

    buildTypes {
        debug {
            // Launcher is the device home app: applicationId must stay com.android.launcher3,
            // so no applicationIdSuffix here (a suffixed id could never become the home app).
            versionNameSuffix "-debug"
            minifyEnabled false
            debuggable true
            signingConfig signingConfigs.debug
        }
        release {
            // No R8/ProGuard: AOSP launcher relies on reflection + non-final R ids; the shipped
            // proguard.flags rules stay wired up for when minification is eventually enabled.
            versionNameSuffix "-release"
            minifyEnabled false
            shrinkResources false
            debuggable false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard.flags'
        }
    }

    buildFeatures {
        compose true
        buildConfig false
        aidl true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    sourceSets {
        main {
            proto.srcDirs = ['protos', 'quickstep/protos_overrides']
            java.srcDirs = [
                'src',
                'dagger',
                'src_plugins',
                'shared/src',
                'quickstep/src',
                'quickstep/dagger',
                'quickstep/src_protolog',
                'modules/widgetpicker/src',
                'modules/appfunctions/src',
                'modules/concurrent/src'
            ]
            res.srcDirs = ['res_merged', 'modules/widgetpicker/res', 'quickstep/res', 'platform_frameworks_libs/frameworks_libs_systemui/dynamiccolors/res', 'platform_frameworks_libs/settingslib_theme_res/res']
            manifest.srcFile 'quickstep/AndroidManifest.xml'
        }
        // protobuf-gradle-plugin registers its per-variant output
        // (build/generated/source/proto/<variant>/java) on each variant's source set itself.
        // Flavor-specific BuildConfig (see tools/buildconfig.sh): generated-src holds the
        // quickstep defaults (widgets/dots enabled); generated-src-go the Android Go overrides.
        withquickstep {
            java.srcDirs += ['generated-src']
        }
        go {
            java.srcDirs += ['go/quickstep/src', 'generated-src-go']
            res.srcDirs += ['go/quickstep/res']
        }
    }
}

kapt {
    correctErrorTypes true
}

// Generated proto java must be ready before kapt stubs / kotlin compilation for EVERY variant
// (task names follow <Action><Flavor><BuildType><Kotlin>, e.g. kaptGenerateStubsQuickstepDebugKotlin,
// generateQuickstepDebugProto). The protobuf plugin already wires its own tasks into the build,
// so only the kapt/compile ordering vs proto generation is asserted here.
gradle.projectsEvaluated {
    tasks.configureEach { t ->
        def m = (t.name =~ /^(?:kaptGenerateStubs|compile)(Quickstep|Go)(Debug|Release)Kotlin$/)
        if (m.matches()) {
            def protoTask = "generate${m.group(1)}${m.group(2)}Proto"
            t.dependsOn(protoTask)
        }
    }
}

protobuf {
    protoc { artifact = 'com.google.protobuf:protoc:4.28.2' }
    generateProtoTasks {
        all().configureEach { task ->
            task.builtins {
                java { option 'lite' }
            }
        }
    }
}

