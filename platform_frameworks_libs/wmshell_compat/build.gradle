// AOSP wm shell shared compat (AnimatedSurface/Utils) — small source module.
plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.android.wm.shell.shared.compat'
    compileSdk 37
    buildToolsVersion "37.0.0"
    defaultConfig { minSdk 31 }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions { jvmTarget = '21' }
    buildFeatures { aidl true }
    lint { abortOnError false }
    sourceSets {
        main {
            java.srcDirs = ['src']
            aidl.srcDirs = ['src']
            manifest.srcFile 'AndroidManifest.xml'
        }
    }
}
dependencies {
    rootProject.addFrameworkJarFor(project, "framework-android17.jar")
    rootProject.addPlatformJarsFor(project, ['SystemUI.jar'])
}
