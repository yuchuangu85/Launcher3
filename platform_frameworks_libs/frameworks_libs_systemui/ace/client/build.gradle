// AOSP ace/client migrated to Gradle (Launcher3-QuickStep-Android17 project)
plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.parcelize'
}
android {
    namespace 'com.android.personalcontext.ace.client'
    compileSdk 37
    buildToolsVersion "37.0.0"
    defaultConfig {
        minSdk 31
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
        freeCompilerArgs = ['-Xjvm-default=all']
    }
    lint {
        abortOnError false
    }
    sourceSets {
        main {
            java.srcDirs = ['../src/com/android/personalcontext/ace/client/']
            res.srcDirs = ['../src/com/android/personalcontext/ace/client/clientsdk/compat/res']
            manifest.srcFile 'AndroidManifest.xml'
        }
    }

    buildFeatures {
        compose = true
    }
}
dependencies {
    rootProject.addFrameworkJarFor(project, "framework-android17.jar")
    rootProject.addPlatformJarsFor(project, ['SystemUI.jar'])
    implementation libs.androidx.core.ktx
    implementation libs.androidx.annotation
    compileOnly project(':pccore')
    api project(':acecommon')
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.runtime
    implementation libs.androidx.compose.material3
    implementation libs.androidx.recyclerview
    implementation libs.androidx.window
    implementation libs.androidx.dynamicanimation
}
