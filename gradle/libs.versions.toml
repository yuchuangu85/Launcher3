# Launcher3-QuickStep-Android17 version catalog.
# All maven coordinates used by the root app and the included library modules
# live here; build scripts reference them via `libs.<name>` accessors.

[versions]
agp = "9.4.0"
kotlin = "2.4.10"
protobufPlugin = "0.9.4"

coreKtx = "1.19.0"
annotation = "1.9.1"
