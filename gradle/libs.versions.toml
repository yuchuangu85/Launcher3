materialIconsExtended = "1.7.8"
activityCompose = "1.13.0"
fragment = "1.9.0"
savedstate = "1.3.0"
constraintlayout = "2.2.2"
recyclerview = "1.4.0"
dynamicanimation = "1.1.0"
coreAnimation = "1.0.0"
preferenceKtx = "1.2.1"
window = "1.5.1"
lifecycle = "2.11.0"
navigationCompose = "2.10.0"
concurrentFutures = "1.3.0"
sliceView = "1.1.0-alpha02"
material = "1.14.0"
lottie = "6.7.1"
appfunctions = "1.0.0-alpha08"
guava = "33.7.1-jre"
protobuf = "4.28.2"
